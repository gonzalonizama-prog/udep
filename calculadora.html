<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora EPS + Oncológico UDEP</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #ffffff;
    color: #002856;
    height: 100%;
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 0;
  }

  /* HEADER compacto */
  .hdr {
    background: #002856;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .hdr-icon {
    width: 32px; height: 32px;
    background: #2E5FA3;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .hdr-icon svg { width: 17px; height: 17px; fill: white; }
  .hdr-text h2 {
    font-size: 14px; font-weight: 700; color: white; line-height: 1.2;
  }
  .hdr-text p {
    font-size: 11px; color: #CADCFC; margin-top: 1px;
  }

  /* BODY */
  .body {
    padding: 16px 20px 14px;
    background: #ffffff;
  }

  .field { margin-bottom: 12px; }

  label {
    display: block;
    font-size: 10.5px; font-weight: 700;
    color: #2E5FA3;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }

  select, input[type="number"] {
    width: 100%;
    padding: 8px 12px;
    border: 1.5px solid #c8d4e3;
    border-radius: 6px;
    font-size: 14px;
    color: #002856;
    background: #f8fafc;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
    appearance: none;
  }
  select:focus, input[type="number"]:focus {
    border-color: #2E5FA3;
    background: #fff;
  }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .btn {
    width: 100%;
    padding: 10px;
    background: #002856;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 14px; font-weight: 700;
    cursor: pointer;
    margin-top: 2px;
    transition: background 0.2s;
  }
  .btn:hover { background: #2E5FA3; }

  /* RESULTADO */
  .result {
    display: none;
    margin-top: 12px;
    border-top: 1.5px solid #e8eef5;
    padding-top: 12px;
  }
  .result.on { display: block; }

  .res-label {
    font-size: 10px; font-weight: 700;
    color: #2E5FA3; text-transform: uppercase;
    letter-spacing: 0.06em; margin-bottom: 8px;
  }

  .line {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 12px; border-radius: 6px; margin-bottom: 5px;
    font-size: 13px;
  }
  .line-a { background: #EEF3FB; }
  .line-b { background: #EEF3FB; }
  .line-total {
    background: #002856; color: white;
    font-weight: 700; font-size: 15px;
    margin-top: 2px;
  }
  .line span:last-child { font-weight: 700; }
  .line-total span:last-child { font-size: 17px; }

  .nota {
    font-size: 10.5px; color: #8a9bb5;
    margin-top: 8px; line-height: 1.4;
  }

  /* ERROR */
  .err {
    display: none;
    background: #fff8e1; border: 1px solid #ffc107;
    color: #7d5a00; padding: 7px 12px;
    border-radius: 6px; font-size: 12px; margin-top: 8px;
  }
  .err.on { display: block; }
</style>
</head>
<body>
<div class="wrap">

  <div class="hdr">
    <div class="hdr-icon">
      <svg viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2zm-7 14H7v-2h5v2zm5-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
    </div>
    <div class="hdr-text">
      <h2>Calcula tu aporte mensual</h2>
      <p>EPS + Oncológico · Vigencia 01/07/2025 – 30/06/2026</p>
    </div>
  </div>

  <div class="body">

    <div class="field">
      <label>Plan EPS</label>
      <select id="plan">
        <option value="">Selecciona un plan</option>
        <option value="basico">Plan Básico</option>
        <option value="adicional1">Plan Adicional 1</option>
        <option value="adicional2">Plan Adicional 2</option>
      </select>
    </div>

    <div class="row2">
      <div class="field">
        <label>Composición de grupo</label>
        <select id="grupo">
          <option value="">Selecciona</option>
          <option value="0">Titular solo</option>
          <option value="1">Titular + 1</option>
          <option value="2">Titular + 2</option>
          <option value="3">Titular + 3</option>
          <option value="4">Titular + 4</option>
          <option value="5">Titular + 5</option>
          <option value="6">Titular + 6</option>
        </select>
      </div>
      <div class="field">
        <label>Tu edad (años)</label>
        <input type="number" id="edad" min="18" max="100" placeholder="Ej: 35">
      </div>
    </div>

    <button class="btn" onclick="calc()">Calcular mi aporte</button>

    <div class="err" id="err"></div>

    <div class="result" id="res">
      <div class="res-label">Tu aporte mensual estimado</div>
      <div class="line line-a">
        <span>Seguro EPS (<span id="pn"></span>)</span>
        <span id="meps"></span>
      </div>
      <div class="line line-b">
        <span>Seguro Oncológico (<span id="ed"></span> años)</span>
        <span id="monco"></span>
      </div>
      <div class="line line-total">
        <span>Total mensual</span>
        <span id="mtotal"></span>
      </div>
      <p class="nota">* Monto a descontar en tu boleta. UDEP asume su parte por separado.</p>
    </div>

  </div>
</div>

<script>
  const EPS = {
    basico:     [66.94, 119.00, 156.19, 208.24, 208.24, 208.24, 208.24],
    adicional1: [161.18, 297.55, 409.16, 545.53, 545.53, 545.53, 545.53],
    adicional2: [277.95, 516.18, 714.76, 952.97, 952.97, 952.97, 952.97]
  };
  const NOM = { basico:'Básico', adicional1:'Adicional 1', adicional2:'Adicional 2' };

  function onco(e) {
    if (e<=25) return 12.70; if (e<=30) return 25.10; if (e<=35) return 27.50;
    if (e<=40) return 33.55; if (e<=45) return 42.45; if (e<=50) return 47.59;
    if (e<=55) return 53.96; if (e==56) return 74.69; if (e==57) return 74.95;
    if (e==58) return 75.08; if (e==59) return 75.67; if (e==60) return 76.74;
    if (e==61) return 80.36; if (e==62) return 81.41; if (e==63) return 83.04;
    if (e==64) return 85.41; if (e==65) return 86.38; if (e==66) return 93.07;
    if (e==67) return 98.92; if (e==68) return 104.76; if (e==69) return 110.59;
    return 114.40;
  }

  function fmt(n) { return 'S/ ' + n.toFixed(2); }

  function calc() {
    const plan  = document.getElementById('plan').value;
    const grupo = document.getElementById('grupo').value;
    const edad  = parseInt(document.getElementById('edad').value);
    const errEl = document.getElementById('err');
    const resEl = document.getElementById('res');

    errEl.className = 'err'; resEl.className = 'result';

    if (!plan)        { errEl.textContent='Selecciona un plan EPS.'; errEl.className='err on'; return; }
    if (grupo==='')   { errEl.textContent='Selecciona la composición de grupo.'; errEl.className='err on'; return; }
    if (!edad||edad<18||edad>100) { errEl.textContent='Ingresa tu edad (18–100 años).'; errEl.className='err on'; return; }

    const e = EPS[plan][parseInt(grupo)];
    const o = onco(edad);

    document.getElementById('pn').textContent    = NOM[plan];
    document.getElementById('ed').textContent    = edad;
    document.getElementById('meps').textContent  = fmt(e);
    document.getElementById('monco').textContent = fmt(o);
    document.getElementById('mtotal').textContent= fmt(e+o);

    resEl.className = 'result on';
  }
</script>
</body>
</html>
